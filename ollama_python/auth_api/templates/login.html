{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Welcome back</h1>
<p class="sub">Log in to chat with ELAW AI.</p>
{% if error_code == "unverified" %}
<p class="hint"><a href="/resend-verification">Resend verification email</a></p>
{% endif %}
<form method="post" action="/login" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next or '/' }}">
  <label>Email<input type="email" name="email" value="{{ email or '' }}" autocomplete="email" required maxlength="254" autofocus></label>
  <label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="128"></label>
  <button type="submit">Log in</button>
</form>
<div class="links">
  <a href="/forgot-password">Forgot password?</a>
  <a href="/register">Create an account</a>
</div>
{% endblock %}
